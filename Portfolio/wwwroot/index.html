<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#e2e2e2" />
        <title>Anderson</title>
        <base href="https://andersonbezerra.com/" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link href="css/app.css?v=10" rel="stylesheet" />
        <link href="css/site-nav.css?v=5" rel="stylesheet" />
        <link href="Portfolio.styles.css?v=2" rel="stylesheet" />
        <link href="manifest.json" rel="manifest" />
        <link href="_content/Blazored.Modal/blazored-modal.css" rel="stylesheet" />
        <link href="Images/icon-512.png" rel="apple-touch-icon" sizes="512x512"/>
        <link href="Images/favicon.png" rel="icon" type="image/png" />
        <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    </head>
    <style>
        body::-webkit-scrollbar {
            display: none;
            width: none;
        }
        body {
            -ms-overflow-style: none;
            overflow-x: hidden;
            background-color: #e2e2e2;
        }
        .splash-terminal {
            width: min(82vw, 21rem);
            height: min(82vw, 21rem);
            min-height: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            font-size: clamp(0.65rem, 3.1vw, 0.82rem);
            line-height: 1.55;
            text-align: left;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        }
        .splash-terminal-chrome {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            height: 2rem;
            padding: 0 0.65rem;
            background: #1c1c1c;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
            pointer-events: none;
            user-select: none;
        }
        .splash-terminal-title {
            color: #9a9a9a;
            font-size: 0.7rem;
            letter-spacing: 0.04em;
        }
        .splash-terminal-controls {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .splash-win-btn {
            width: 1.05rem;
            height: 1.05rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #555;
            background: #2a2a2a;
            color: #c8c8c8;
            font-size: 0.55rem;
            line-height: 1;
        }
        .splash-win-btn.close {
            border-color: #6a3030;
            background: #3a2020;
            color: #e0a0a0;
        }
        .splash-terminal-body {
            flex: 1;
            padding: 0.85rem 1rem;
            overflow: hidden;
        }
        .splash-terminal-line {
            margin: 0;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
        }
        .splash-caret {
            display: inline-block;
            width: 0.55ch;
            margin-left: 1px;
            background: #fff;
            animation: splash-caret-blink 0.9s step-end infinite;
        }
        @keyframes splash-caret-blink {
            50% { opacity: 0; }
        }
        #splash-root {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e2e2e2;
        }
    </style>
    <script>
        window.openInNewTab = function (url) {
            window.open(url, '_blank');
        };

        window.loadScript = function (src) {
            return new Promise(function (resolve, reject) {
                var script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        };

        window.bootApp = async function () {
            var line1 = document.getElementById('splash-line-1');
            var line2 = document.getElementById('splash-line-2');
            var line3 = document.getElementById('splash-line-3');
            var caret = document.getElementById('splash-caret');
            var splashRoot = document.getElementById('splash-root');
            var spinTimer = null;

            function type(text, target) {
                return new Promise(function (done) {
                    if (!target) {
                        done();
                        return;
                    }
                    var i = 0;
                    target.textContent = '';
                    var timer = setInterval(function () {
                        target.textContent += text.charAt(i);
                        i += 1;
                        if (i >= text.length) {
                            clearInterval(timer);
                            done();
                        }
                    }, 45);
                });
            }

            function pause(ms) {
                return new Promise(function (r) { setTimeout(r, ms); });
            }

            function startSpin() {
                if (!line3)
                    return;
                if (caret)
                    caret.style.display = 'none';
                var frames = ['|', '/', '-', '\\'];
                var i = 0;
                line3.textContent = '>_ Carregando... ' + frames[0];
                spinTimer = setInterval(function () {
                    if (!line3.isConnected) {
                        clearInterval(spinTimer);
                        return;
                    }
                    i = (i + 1) % frames.length;
                    line3.textContent = '>_ Carregando... ' + frames[i];
                }, 90);
            }

            function waitForApp() {
                var app = document.getElementById('app');
                if (!app)
                    return Promise.resolve();
                if (app.childElementCount > 0)
                    return Promise.resolve();

                return new Promise(function (resolve) {
                    var obs = new MutationObserver(function () {
                        if (app.childElementCount > 0) {
                            obs.disconnect();
                            resolve();
                        }
                    });
                    obs.observe(app, { childList: true, subtree: true });
                    setTimeout(function () {
                        obs.disconnect();
                        resolve();
                    }, 30000);
                });
            }

            var intro = (async function () {
                if (!line1 || !line2 || !line3)
                    return;
                await type('>_ Olá me chamo Anderson', line1);
                await pause(280);
                if (caret)
                    line2.parentNode.appendChild(caret);
                await type('>_ Bem vindo ao meu sistema.', line2);
                await pause(220);
                if (caret)
                    line3.parentNode.appendChild(caret);
                await type('>_ Carregando...', line3);
                startSpin();
            })();

            try {
                await window.loadScript('_framework/blazor.webassembly.js');
                await waitForApp();
            } catch (e) {
                console.error('failed to start blazor:', e);
            }

            await intro;
            if (spinTimer)
                clearInterval(spinTimer);
            if (line3)
                line3.textContent = '>_ Carregando... ok';
            await pause(520);
            if (splashRoot && splashRoot.isConnected)
                splashRoot.remove();

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker
                    .register('service-worker.js', { updateViaCache: 'none' })
                    .then(function (registration) { registration.update(); });
            }
        };
    </script>
    <body data-bs-theme="light">
        <div id="splash-root">
            <div class="splash-terminal" aria-live="polite">
                <div class="splash-terminal-chrome" aria-hidden="true">
                    <span class="splash-terminal-title">terminal</span>
                    <div class="splash-terminal-controls">
                        <span class="splash-win-btn" title="Minimizar">─</span>
                        <span class="splash-win-btn" title="Expandir">□</span>
                        <span class="splash-win-btn close" title="Fechar">✕</span>
                    </div>
                </div>
                <div class="splash-terminal-body">
                    <p class="splash-terminal-line">
                        <span id="splash-line-1"></span><span id="splash-caret" class="splash-caret">&nbsp;</span>
                    </p>
                    <p class="splash-terminal-line">
                        <span id="splash-line-2"></span>
                    </p>
                    <p class="splash-terminal-line">
                        <span id="splash-line-3"></span>
                    </p>
                </div>
            </div>
        </div>
        <div id="app"></div>
        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
        </script>
        <script src="js/produto-model.js?v=10"></script>
        <script src="js/emo/emulator.js?v=13"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script>
            window.bootApp();
        </script>
    </body>
</html>
